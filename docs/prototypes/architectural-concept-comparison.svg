<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1320" viewBox="0 0 1500 1320" role="img" aria-labelledby="title desc">
<title id="title">Habitta: three architectural concept proposals</title>
<desc id="desc">A review board comparing Crest, a twelve-storey ridge tower; Contour, four stepped hillside levels; and Grove, a two-storey courtyard building. It includes district placement, massing at a shared height scale, schematic room arrangements, and material palettes. All designs are proposals awaiting review.</desc>
